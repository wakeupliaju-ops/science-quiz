<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>K-Science 과학퀴즈</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #F6F7F9; --surface: #FFFFFF; --ink: #16213A; --soft: #5F6A80; --faint: #98A1B3; --line: #E3E7EE;
  --accent: #2F6FEB; --ok: #17845A; --ok-bg: #E6F4EC; --no: #C23B41; --no-bg: #FCE9EA;
  color-scheme: light; box-sizing: border-box;
  padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px);
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0F1523; --surface: #182136; --ink: #E8EDF5; --soft: #A3AEC3; --faint: #6E7A93; --line: #27334C;
    --accent: #709DFF; --ok: #4DCB91; --ok-bg: #12301F; --no: #F27A80; --no-bg: #3A1A20; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0F1523; --surface: #182136; --ink: #E8EDF5; --soft: #A3AEC3; --faint: #6E7A93; --line: #27334C;
  --accent: #709DFF; --ok: #4DCB91; --ok-bg: #12301F; --no: #F27A80; --no-bg: #3A1A20; color-scheme: dark;
}
*, *::before, *::after { box-sizing: inherit; }
html { height: 100%; }
body {
  margin: 0; min-height: 100%; background: var(--bg); color: var(--ink);
  font-family: "IBM Plex Sans KR", "Pretendard", "Apple SD Gothic Neo", "Malgun Gothic", system-ui, sans-serif;
  line-height: 1.6; -webkit-font-smoothing: antialiased; word-break: keep-all; overflow-wrap: break-word;
}
button { font: inherit; color: inherit; cursor: pointer; -webkit-tap-highlight-color: transparent; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; border-radius: 8px; }
[hidden] { display: none !important; }
main { max-width: 600px; margin: 0 auto; padding: 0 22px 64px; }

/* Start */
#start { min-height: calc(100vh - 110px); min-height: calc(100dvh - 110px); display: flex; flex-direction: column; justify-content: center; padding-bottom: 8vh; }
#start h1 { margin: 0 0 10px; font-size: clamp(34px, 8vw, 46px); line-height: 1.2; letter-spacing: -0.035em; }
#start p { margin: 0 0 36px; color: var(--soft); font-size: 17px; }

.btn {
  display: block; width: 100%; border: 0; border-radius: 12px; padding: 17px;
  font-size: 17px; font-weight: 700; background: var(--ink); color: var(--bg);
}
.btn:hover { opacity: .9; }
.btn.line { background: transparent; color: var(--ink); border: 1.5px solid var(--line); }

/* Quiz */
.top { position: sticky; top: env(safe-area-inset-top, 0px); background: var(--bg); padding: 22px 0 18px; z-index: 2; }
.top .row { display: flex; justify-content: space-between; align-items: center; font-size: 14px; color: var(--soft); margin-bottom: 10px; }
.top .row b { color: var(--ink); font-weight: 700; }
.top .row button { background: none; border: 0; padding: 4px 0; color: var(--faint); font-size: 14px; }
.bar { height: 4px; border-radius: 2px; background: var(--line); overflow: hidden; }
.bar i { display: block; height: 100%; width: 0; background: var(--accent); transition: width .3s ease; }

.q { padding-top: 22px; }
.q.enter { animation: rise .25s ease both; }
@keyframes rise { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
.qtext { margin: 0 0 26px; font-size: clamp(21px, 5vw, 26px); font-weight: 700; line-height: 1.45; letter-spacing: -0.02em; }
.opts { display: grid; gap: 10px; }
.opt {
  text-align: left; background: var(--surface); border: 1.5px solid var(--line); border-radius: 12px;
  padding: 16px 18px; font-size: 16.5px; line-height: 1.45; min-height: 58px;
  display: flex; align-items: center; justify-content: space-between; gap: 12px;
  transition: border-color .12s ease;
}
.opt:hover:not(:disabled) { border-color: var(--ink); }
.opt:disabled { cursor: default; }
.opt .mark { flex: none; font-size: 13px; font-weight: 700; }
.opt.ok { background: var(--ok-bg); border-color: var(--ok); }
.opt.ok .mark { color: var(--ok); }
.opt.no { background: var(--no-bg); border-color: var(--no); }
.opt.no .mark { color: var(--no); }
.opt.dim { opacity: .4; }
.fb { margin-top: 24px; animation: rise .22s ease both; }
.fb .v { margin: 0 0 6px; font-weight: 700; font-size: 17px; }
.fb p.e { margin: 0 0 22px; color: var(--soft); font-size: 15.5px; }

/* Result */
#result { padding-top: 12vh; }
.score { font-size: clamp(64px, 18vw, 92px); font-weight: 700; line-height: 1; letter-spacing: -0.05em; }
.score span { font-size: .38em; color: var(--faint); font-weight: 500; letter-spacing: -0.02em; margin-left: 6px; }
.rmsg { margin: 14px 0 32px; color: var(--soft); font-size: 17px; }
.actions { display: grid; gap: 10px; }
.review h2 { font-size: 16px; margin: 48px 0 6px; }
.review ul { list-style: none; margin: 0; padding: 0; }
.review li { padding: 16px 0; border-top: 1px solid var(--line); }
.review li:first-child { border-top: 0; }
.review .rq { font-weight: 700; margin-bottom: 4px; }
.review .ra { font-size: 15px; }
.review .ra b { color: var(--ok); }
.review .ra s { color: var(--no); text-decoration: none; }
.review .re { font-size: 14.5px; color: var(--soft); margin-top: 4px; }

@media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; transition: none !important; } }

.grades { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
.grade {
  background: var(--surface); border: 1.5px solid var(--line); border-radius: 12px;
  padding: 22px 8px; font-size: 18px; font-weight: 700; transition: border-color .12s ease;
}
.grade:hover { border-color: var(--ink); }
.grade span { display: block; font-size: 13px; font-weight: 500; color: var(--faint); margin-top: 2px; }
#start .note { margin: 22px 0 0; font-size: 13px; color: var(--faint); }
.credit { margin: 0; padding: 0 22px 20px; text-align: center; font-size: 12px; color: var(--faint); }
</style>
</head>
<body>
<main>
  <section id="start">
    <h1>K-Science 과학퀴즈</h1>
    <p>실험을 마쳤다면 퀴즈로 확인해 봐요!</p>
    <div class="grades" id="grades"></div>
    <p class="note">학년마다 10문제가 무작위로 나와요. 1학년 도토리 팽이(원심력·물체의 운동), 2·3학년 자석 자동차(자석의 힘·자기력), 4~6학년 전지 회로(양극과 음극·전기)</p>
  </section>

  <section id="quiz" hidden>
    <div class="top">
      <div class="row"><span><span id="glabel"></span> · <b id="cur">1</b> / <span id="tot">20</span></span><button id="quit">처음으로</button></div>
      <div class="bar"><i id="prog"></i></div>
    </div>
    <div class="q" id="q">
      <p class="qtext" id="qtext"></p>
      <div class="opts" id="opts" role="group" aria-label="보기"></div>
      <div class="fb" id="fb" hidden aria-live="polite">
        <p class="v" id="verdict"></p>
        <p class="e" id="exp"></p>
        <button class="btn" id="next">다음 문제</button>
      </div>
    </div>
  </section>

  <section id="result" hidden>
    <div class="score" id="score"></div>
    <p class="rmsg" id="rmsg"></p>
    <div class="actions">
      <button class="btn" id="again">다시 풀기</button>
      <button class="btn line" id="home">다른 학년 고르기</button>
    </div>
    <div class="review" id="review"></div>
  </section>
</main>
<footer class="credit">세명초등학교 3학년 별반 K-Science팀</footer>

 ["자석의 힘으로 레일 위에 살짝 떠서 달리는 기차는?", "자기 부상 열차", ["증기 기관차", "케이블카", "롤러코스터"], "자기 부상 열차는 자석의 힘으로 떠서 달려요. 바퀴가 레일에 닿지 않아 조용하고 덜 흔들려요."],
 ["나침반이 북쪽을 가리키는 것을 보면 지구는 무엇과 같다고 할 수 있을까요?", "커다란 자석", ["커다란 건전지", "커다란 팽이", "커다란 전구"], "지구는 거대한 자석처럼 행동해요. 그래서 나침반 바늘이 북쪽을 가리켜요."],
 ["철 못을 자석으로 한 방향으로 여러 번 문지르면 어떻게 될까요?", "못이 잠시 자석이 된다", ["못이 녹는다", "못이 나무가 된다", "아무 변화가 없다"], "자석으로 한 방향으로 문지르면 철 못이 자석의 성질을 갖게 돼서 클립을 끌어당겨요."],
 ["N극 자석 위에 N극을 아래로 한 고리 자석을 끼우면 어떻게 될까요?", "위 자석이 붕 떠 있다", ["딱 붙는다", "옆으로 날아가 사라진다", "자석이 깨진다"], "같은 극끼리 밀어내는 힘 때문에 위 자석이 공중에 떠 있어요."],
 ["자석의 세기를 비교하는 좋은 방법은?", "붙는 클립의 수를 세어 본다", ["자석의 색깔을 본다", "자석의 냄새를 맡는다", "자석을 흔들어 소리를 듣는다"], "클립이 많이 붙을수록 자석의 힘이 센 거예요. 같은 클립으로 비교해야 공정해요."],
 ["자석 자동차를 만들 때 자석을 붙이는 방향이 중요한 까닭은?", "극에 따라 밀지 당길지가 달라져서", ["색깔이 예뻐 보여서", "자동차가 가벼워져서", "바퀴가 커져서"], "자동차 자석의 극을 알아야 손 자석으로 밀지 끌어당길지 정할 수 있어요."],
 ["말굽자석의 극은 어디에 있을까요?", "두 끝부분", ["휘어진 가운데", "자석 전체", "극이 없다"], "말굽자석도 막대자석처럼 두 끝에 N극과 S극이 있어요."],
 ["분리수거장에서 철 캔과 알루미늄 캔을 나눌 때 쓰는 것은?", "큰 자석", ["큰 선풍기", "큰 거울", "큰 돋보기"], "자석은 철 캔만 끌어당겨서 알루미늄 캔과 쉽게 나눌 수 있어요."],
 ["N극의 'N'은 무엇을 뜻할까요?", "북쪽(North)", ["새로움(New)", "아니요(No)", "숫자(Number)"], "N은 북쪽(North), S는 남쪽(South)을 뜻해요. 자석이 가리키는 방향에서 이름을 따왔어요."],
 ["자석 자동차가 멈췄어요. 다시 움직이게 하려면 손 자석을 어떻게 할까요?", "자동차에 더 가까이 댄다", ["더 멀리 뗀다", "자석을 물에 담근다", "자석을 숨긴다"], "자기력은 가까울수록 세져요. 가까이 대면 다시 밀거나 당길 수 있어요."],
 ["자석의 힘이 미치는 주변 공간을 무엇이라고 할까요?", "자기장", ["운동장", "놀이터", "전기장판"], "자석 둘레에 자석의 힘이 작용하는 공간을 자기장이라고 해요. 철가루를 뿌리면 모양을 볼 수 있어요."],
 ["교통카드나 은행 카드의 검은 띠 가까이에 센 자석을 두면 안 되는 까닭은?", "카드 속 정보가 지워질 수 있어서", ["카드가 녹아서", "카드에 불이 나서", "카드가 무거워져서"], "검은 띠(마그네틱)는 자석으로 정보를 저장해요. 센 자석이 닿으면 정보가 망가질 수 있어요."],
 ["자석에 붙는 것끼리 바르게 모은 것은?", "철 못, 철 클립, 철 옷핀", ["유리구슬, 철 못, 고무줄", "알루미늄 캔, 종이, 철 클립", "나무젓가락, 플라스틱 자, 철 못"], "철로 만든 물건만 자석에 붙어요. 유리, 고무, 종이, 나무, 알루미늄은 붙지 않아요."],
 ["두 자석을 가까이 했더니 서로 밀어냈어요. 마주 본 극은 어떤 극일까요?", "같은 극끼리", ["다른 극끼리", "가운데끼리", "알 수 없다"], "서로 밀어냈다면 N극과 N극, 또는 S극과 S극처럼 같은 극이 마주 본 거예요."],
 ["자석 자동차에서 손 자석을 자동차에 닿지 않게 대는 까닭은?", "떨어져 있어도 자기력이 작용하는 걸 보려고", ["자석이 뜨거워서", "자석이 더러워서", "닿으면 자석이 사라져서"], "자기력은 닿지 않아도 작용해요. 그래서 손을 대지 않고도 자동차를 움직일 수 있어요."],
 ["바다에서 길을 잃지 않도록 옛날 뱃사람들이 사용한 자석 도구는?", "나침반", ["망원경", "온도계", "저울"], "나침반은 자석의 성질을 이용해 방향을 알려 줘요. 옛날부터 바다 여행에 꼭 필요했어요."],
 ["N극과 S극이 표시되지 않은 자석의 극을 알아내는 방법은?", "나침반을 가까이 대 본다", ["자석을 물에 끓인다", "자석의 무게를 잰다", "자석 색깔을 본다"], "나침반 바늘의 N극이 끌려가면 그쪽은 S극, 밀려나면 N극이에요."],
 ["자석 자동차를 두 손 자석으로 앞뒤에서 함께 움직이려면?", "뒤에서는 밀고 앞에서는 끌어당기게 극을 맞춘다", ["앞뒤 모두 밀어내게 한다", "앞뒤 모두 아무 극이나 댄다", "자석을 자동차 위에 올린다"], "뒤에서는 같은 극으로 밀고, 앞에서는 다른 극으로 당기면 자동차가 힘차게 앞으로 가요."],
 ["자석 주위에 놓은 여러 개의 나침반 바늘은 어떻게 될까요?", "놓인 곳마다 바늘 방향이 달라진다", ["모두 북쪽만 가리킨다", "모두 멈춰서 빙글빙글 돈다", "바늘이 모두 사라진다"], "자석 주변에서는 자기력의 방향이 곳마다 달라서 나침반 바늘이 서로 다른 쪽을 가리켜요."],
 ["자석 자동차 실험으로 알 수 있는 사실로 알맞은 것은?", "자기력은 떨어져 있어도 작용하고 같은 극은 밀어낸다", ["자기력은 닿아야만 작용한다", "모든 금속은 자석에 붙는다", "자석은 한 가지 극만 있다"], "자기력은 떨어져 있어도 작용하고, 같은 극은 밀고 다른 극은 당겨요. 이 원리로 자동차를 움직였어요."]
],
4: [
 ["건전지에서 볼록 튀어나온 쪽은 무슨 극일까요?", "(+)극", ["(-)극", "N극", "S극"], "건전지의 볼록한 쪽이 (+)극(양극), 평평한 쪽이 (-)극(음극)이에요."],
 ["건전지에서 평평한 쪽은 무슨 극일까요?", "(-)극", ["(+)극", "N극", "가운데극"], "평평한 쪽이 (-)극(음극)이에요. 건전지 겉에도 +, - 표시가 있어요."],
 ["(+)극을 다른 말로 무엇이라고 할까요?", "양극", ["음극", "북극", "남극"], "(+)극은 양극, (-)극은 음극이라고 불러요."],
 ["전구에 불이 켜지려면 전선을 어떻게 이어야 할까요?", "전지 (+)극 → 전구 → 전지 (-)극으로 끊김 없이 한 바퀴", ["전지 (+)극에만 전선 하나를 잇는다", "전구 한쪽만 전지에 대 본다", "전선을 전구에 감아 두기만 한다"], "전기는 끊어지지 않은 고리 모양의 길이 있어야 흘러요. 그래야 전구에 불이 켜져요."],
 ["전기가 흐르는 길을 무엇이라고 할까요?", "전기 회로", ["전기 도로", "전기 터널", "전기 계단"], "전지, 전선, 전구 같은 부품을 이어서 전기가 흐르도록 만든 길을 전기 회로라고 해요."],
 ["불이 켜진 회로에서 전선 한쪽을 떼면 어떻게 될까요?", "불이 꺼진다", ["불이 더 밝아진다", "불이 깜빡이며 계속 켜진다", "전지가 터진다"], "길이 끊어지면 전기가 흐르지 못해서 전구가 꺼져요."],
 ["전기가 잘 통하는 물건은?", "철 클립", ["고무지우개", "종이", "나무젓가락"], "철, 구리, 알루미늄 같은 금속은 전기가 잘 통해요."],
 ["전기가 잘 통하지 않는 물건은?", "플라스틱 자", ["알루미늄 포일", "동전", "철 클립"], "플라스틱, 고무, 나무, 종이는 전기가 잘 통하지 않아요."],
 ["전선 겉을 비닐로 감싸 놓은 까닭은?", "전기가 엉뚱한 곳으로 새거나 감전되지 않게 하려고", ["전선을 예쁘게 하려고", "전선을 무겁게 하려고", "전기를 더 빨리 흐르게 하려고"], "비닐은 전기가 잘 통하지 않아요. 그래서 전기가 새지 않게 막아 주고 우리를 지켜 줘요."],
 ["회로에서 스위치는 어떤 일을 할까요?", "전기를 흐르게 하거나 끊는다", ["전기를 만든다", "빛을 낸다", "전지를 충전한다"], "스위치를 닫으면 길이 이어져 전기가 흐르고, 열면 길이 끊겨 전기가 멈춰요."],
 ["건전지를 끼울 때 +, - 표시를 맞춰야 하는 까닭은?", "방향이 맞아야 전기가 제대로 흐르니까", ["예쁘게 보이려고", "건전지가 가벼워지려고", "아무 이유가 없다"], "전지는 (+)극과 (-)극의 방향이 있어요. 거꾸로 넣으면 기구가 작동하지 않을 수 있어요."],
 ["전지의 (+)극과 (-)극을 전선 하나로 바로 이으면 어떻게 될까요?", "전지가 뜨거워져 위험하다", ["전구 없이도 불이 켜진다", "전지가 새것이 된다", "아무 일도 없다"], "전구 없이 두 극을 바로 이으면 전기가 한꺼번에 흘러 전지와 전선이 뜨거워져요. 절대 하면 안 돼요."],
 ["회로에서 빛을 내는 부품은?", "전구", ["전선", "스위치", "집게"], "전구는 전기가 흐르면 빛을 내요."],
 ["연필심(흑연)은 전기가 통할까요?", "통한다", ["전혀 통하지 않는다", "물에 젖어야만 통한다", "빨간 연필만 통한다"], "연필심의 흑연은 금속이 아니지만 전기가 통해요. 회로에 넣으면 전구가 희미하게 켜져요."],
 ["알루미늄 포일을 회로에 이으면 전구는 어떻게 될까요?", "켜진다", ["켜지지 않는다", "녹아 버린다", "색이 바뀐다"], "알루미늄은 금속이라서 전기가 잘 통해요. 전선 대신 써도 불이 켜져요."],
 ["LED의 두 다리 중 긴 다리는 전지의 어느 극에 이어야 할까요?", "(+)극", ["(-)극", "아무 극이나", "둘 다 이으면 안 된다"], "LED는 긴 다리를 (+)극, 짧은 다리를 (-)극에 이어야 불이 켜져요."],
 ["LED를 거꾸로 연결하면 어떻게 될까요?", "불이 켜지지 않는다", ["더 밝게 켜진다", "다른 색으로 켜진다", "LED가 커진다"], "LED는 한쪽 방향으로만 전기가 흘러요. 거꾸로 이으면 불이 켜지지 않아요."],
 ["회로에서 전지는 어떤 역할을 할까요?", "전기가 흐르도록 힘을 준다", ["빛을 낸다", "전기를 끊는다", "전선을 잡아 준다"], "전지는 회로에 전기가 흐르도록 밀어 주는 힘을 줘요."],
 ["전구에 불이 안 켜질 때 먼저 확인할 것은?", "전선이 잘 이어졌는지, 전지 방향이 맞는지", ["전선 색깔이 예쁜지", "책상이 깨끗한지", "전구 이름이 무엇인지"], "연결이 끊어졌거나 전지가 다 닳았거나 방향이 틀리면 불이 안 켜져요. 하나씩 살펴봐요."],
 ["젖은 손으로 플러그를 만지면 안 되는 까닭은?", "물이 전기를 통하게 해서 감전될 수 있어서", ["손이 미끄러워서", "플러그가 녹슬어서", "손이 차가워져서"], "물기가 있으면 전기가 몸으로 흐를 수 있어요. 손을 잘 말린 뒤 만져요."],
 ["콘센트 구멍에 젓가락을 넣어도 될까요?", "절대 안 된다", ["쇠젓가락은 괜찮다", "나무젓가락은 괜찮다", "어른이 없을 때는 괜찮다"], "콘센트에는 아주 센 전기가 흘러요. 어떤 물건도 구멍에 넣으면 안 돼요."],
 ["다 쓴 건전지는 어디에 버려야 할까요?", "폐건전지 수거함", ["일반 쓰레기통", "화단 흙 속", "변기"], "건전지 속 물질은 환경에 해로울 수 있어요. 따로 모으면 재활용도 할 수 있어요."],
 ["전구를 잡아 주어 전선과 쉽게 연결하게 해 주는 부품은?", "전구 끼우개", ["건전지", "스위치", "고무줄"], "전구 끼우개(소켓)에 전구를 돌려 끼우면 전선과 쉽게 이을 수 있어요."],
 ["전지를 넣어 쓰는 물건이 아닌 것은?", "나무 블록", ["TV 리모컨", "손전등", "벽시계"], "리모컨, 손전등, 벽시계는 건전지의 전기로 움직여요. 나무 블록은 전기가 필요 없어요."],
 ["회로가 끊긴 곳 없이 이어져 있는 것을 무엇이라고 할까요?", "닫힌 회로", ["열린 회로", "부서진 회로", "젖은 회로"], "끊긴 곳 없이 이어진 닫힌 회로에서만 전기가 흘러요. 끊긴 회로는 열린 회로라고 해요."],
 ["100원 동전 두 개를 전선 사이에 끼워 넣으면 전구는 어떻게 될까요?", "켜진다", ["켜지지 않는다", "동전이 녹는다", "동전이 자석이 된다"], "동전은 금속이라서 전기가 통해요. 길을 이어 주면 전구가 켜져요."],
 ["감전을 막으려고 전기 공사하는 사람이 끼는 장갑은 무엇으로 만들까요?", "고무", ["철", "알루미늄", "구리"], "고무는 전기가 잘 통하지 않아서 몸을 보호해 줘요."],
 ["전구 속에서 빛을 내는 아주 가는 선을 무엇이라고 할까요?", "필라멘트", ["스위치", "전지", "피복"], "필라멘트에 전기가 흐르면 뜨거워지면서 빛을 내요."],
 ["손전등 안에서 전기가 흐르는 길을 바르게 말한 것은?", "전지 → 스위치 → 전구 → 다시 전지", ["전지 → 전구에서 끝", "스위치 → 공기 → 전구", "전구 → 손잡이 → 하늘"], "손전등 안에도 전기 회로가 있어요. 스위치를 켜면 길이 이어져 전구가 켜져요."],

 ["선풍기는 전기 에너지를 주로 무엇으로 바꿀까요?", "움직임(운동 에너지)", ["빛", "소리만", "얼음"], "선풍기 속 전동기(모터)가 전기로 날개를 돌려요. 전동기 안에도 자석이 들어 있어요."],
 ["전기다리미는 전기 에너지를 주로 무엇으로 바꿀까요?", "열", ["바람", "소리", "자석"], "전기다리미, 전기밥솥, 전기난로는 전기를 열로 바꿔요."],
 ["태양 전지는 무엇을 전기로 바꿀까요?", "빛", ["소리", "냄새", "바람"], "태양 전지는 햇빛을 받아 전기를 만들어요. 계산기나 가로등에서도 볼 수 있어요."],
 ["충전해서 여러 번 다시 쓸 수 있는 전지는?", "충전지", ["일회용 건전지", "레몬 전지", "전구"], "휴대 전화와 전기 자동차에 들어 있는 충전지는 다시 충전해서 쓸 수 있어요."],
 ["플러그를 꽂아만 두어도 조금씩 새어 나가는 전기를 무엇이라고 할까요?", "대기 전력", ["정전기", "번개", "전자석"], "쓰지 않아도 꽂혀 있으면 대기 전력이 새어 나가요. 플러그를 뽑으면 아낄 수 있어요."],
 ["전류의 세기를 나타내는 단위는?", "암페어(A)", ["볼트(V)", "미터(m)", "그램(g)"], "전류는 암페어(A), 전압은 볼트(V)로 나타내요."],
 ["전압을 물이 흐르는 것에 비유하면 무엇과 비슷할까요?", "물을 밀어 주는 높이 차이", ["물의 색깔", "물의 온도", "물통의 무게"], "높은 곳의 물이 낮은 곳으로 흐르듯, 전압은 전기를 흐르게 하는 높이 차이와 같아요."],
 ["전기가 너무 많이 흐르거나 샐 때 자동으로 전기를 끊어 주는 장치는?", "누전 차단기", ["전구 끼우개", "집게 전선", "건전지 홀더"], "누전 차단기는 위험할 때 스스로 전기를 끊어 화재와 감전을 막아요."],
 ["회로도에서 전기 부품을 간단한 그림으로 나타낸 것을 무엇이라고 할까요?", "전기 기호", ["지도 기호", "악보", "수학 공식"], "전지, 전구, 스위치 같은 부품을 약속된 기호로 그리면 회로를 한눈에 알 수 있어요."],
 ["같은 전구 두 개를 병렬로 연결하면 전지는 전구 한 개일 때보다?", "더 빨리 닳는다", ["더 늦게 닳는다", "전혀 닳지 않는다", "다시 충전된다"], "병렬로 이은 전구들은 각자 전기를 쓰기 때문에 전지가 더 빨리 닳아요."],
 ["전기 자동차가 움직이는 데 필요한 전기를 저장하는 곳은?", "배터리(충전지)", ["주유 탱크", "트렁크", "와이퍼"], "전기 자동차는 배터리에 저장한 전기로 전동기를 돌려서 달려요."],
 ["다 쓴 건전지를 따로 모아야 하는 까닭은?", "해로운 물질이 나오지 않게 하고 재활용하려고", ["건전지가 다시 새것이 되어서", "무거워서 버리기 힘들어서", "모으면 전기가 생겨서"], "건전지 속 금속과 물질은 땅과 물을 오염시킬 수 있어요. 모으면 금속을 다시 쓸 수 있어요."],
 ["전자석을 이용한 물건이 아닌 것은?", "고무 지우개", ["스피커", "자기 부상 열차", "초인종"], "스피커, 자기 부상 열차, 초인종에는 전자석이 들어 있어요."],
 ["물기가 있는 욕실에서 전기 기구를 쓸 때 조심해야 하는 까닭은?", "물을 통해 몸에 전기가 흐를 수 있어서", ["물이 전기를 완전히 막아서", "전기 기구가 가벼워져서", "전기 요금이 줄어서"], "물이 묻으면 전기가 몸으로 흘러 감전될 수 있어요. 마른 손으로, 물기 없는 곳에서 써요."],
 ["전지 회로 실험에서 알게 된 것으로 알맞은 것은?", "전지와 전구를 연결하는 방법에 따라 밝기와 쓰는 시간이 달라진다", ["연결 방법과 상관없이 밝기는 늘 같다", "전지는 극이 없어서 아무렇게나 넣어도 된다", "전류는 끊어진 회로에서도 흐른다"], "직렬로 이으면 전압이 커져 밝아지고, 병렬로 이으면 오래가요. 연결 방법이 중요해요."]
]
};
const TOPIC = {"1": "도토리 팽이", "2": "자석 자동차", "3": "자석 자동차", "4": "전지 회로", "5": "전지 회로", "6": "전지 회로"};

const $ = (id) => document.getElementById(id);
const reduced = () => matchMedia("(prefers-reduced-motion: reduce)").matches;
function shuffle(a) { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }
function el(tag, cls, text) { const n = document.createElement(tag); if (cls) n.className = cls; if (text != null) n.textContent = text; return n; }
function show(id) { ["start", "quiz", "result"].forEach(s => $(s).hidden = s !== id); window.scrollTo(0, 0); }

let s = null;

for (let g = 1; g <= 6; g++) {
  const b = el("button", "grade", g + "학년");
  b.appendChild(el("span", null, TOPIC[g]));
  b.addEventListener("click", () => begin(g));
  $("grades").appendChild(b);
}

function begin(grade) {
  const list = shuffle(G[grade]).slice(0, ROUND).map(([q, a, w, e]) => ({ q, a, w, e, opts: shuffle([a, ...w]), chosen: null }));
  s = { grade, list, i: 0, results: [], answered: false };
  $("glabel").textContent = grade + "학년 " + TOPIC[grade];
  $("tot").textContent = list.length;
  show("quiz");
  render();
}

function render() {
  const q = s.list[s.i];
  s.answered = false;
  $("cur").textContent = s.i + 1;
  $("prog").style.width = (s.i / s.list.length * 100) + "%";
  $("qtext").textContent = q.q;
  $("fb").hidden = true;
  const box = $("opts"); box.innerHTML = "";
  q.opts.forEach((o, k) => {
    const b = el("button", "opt");
    b.append(el("span", null, o), el("span", "mark"));
    b.addEventListener("click", () => answer(k));
    box.appendChild(b);
  });
  const c = $("q"); c.classList.remove("enter"); void c.offsetWidth; c.classList.add("enter");
}

function answer(k) {
  if (s.answered) return;
  s.answered = true;
  const q = s.list[s.i];
  q.chosen = q.opts[k];
  const ok = q.chosen === q.a;
  s.results[s.i] = ok;
  [...$("opts").children].forEach((b, idx) => {
    b.disabled = true;
    if (q.opts[idx] === q.a) { b.classList.add("ok"); b.lastChild.textContent = "정답"; }
    else if (idx === k) { b.classList.add("no"); b.lastChild.textContent = "내 답"; }
    else b.classList.add("dim");
  });
  $("verdict").textContent = ok ? "정답이에요" : "아쉬워요";
  $("verdict").style.color = ok ? "var(--ok)" : "var(--no)";
  $("exp").textContent = q.e;
  $("next").textContent = s.i === s.list.length - 1 ? "결과 보기" : "다음 문제";
  $("fb").hidden = false;
  $("prog").style.width = ((s.i + 1) / s.list.length * 100) + "%";
  $("next").focus({ preventScroll: true });
  $("fb").scrollIntoView({ behavior: reduced() ? "auto" : "smooth", block: "nearest" });
}

function next() {
  if (!s.answered) return;
  if (s.i < s.list.length - 1) { s.i++; render(); window.scrollTo({ top: 0, behavior: reduced() ? "auto" : "smooth" }); }
  else finish();
}

function finish() {
  const total = s.list.length, score = s.results.filter(Boolean).length, r = score / total;
  $("score").innerHTML = ""; $("score").append(String(score), el("span", null, "/ " + total));
  $("rmsg").textContent = s.grade + "학년 " + TOPIC[s.grade] + " · " + (r === 1 ? "만점이에요. 완벽해요." : r >= 0.8 ? "훌륭해요. 거의 다 맞혔어요." : r >= 0.5 ? "절반 넘게 맞혔어요." : "아래 해설을 읽고 한 번 더 도전해 보세요.");
  const rv = $("review"); rv.innerHTML = "";
  const wrong = s.list.filter((_, k) => !s.results[k]);
  if (wrong.length) {
    rv.appendChild(el("h2", null, `틀린 문제 ${wrong.length}개`));
    const ul = el("ul");
    wrong.forEach(q => {
      const li = el("li"), ra = el("div", "ra");
      ra.append("정답 ", el("b", null, q.a), " · 내 답 ", el("s", null, q.chosen));
      li.append(el("div", "rq", q.q), ra, el("div", "re", q.e));
      ul.appendChild(li);
    });
    rv.appendChild(ul);
  }
  show("result");
  $("again").focus({ preventScroll: true });
}

$("again").addEventListener("click", () => begin(s.grade));
$("home").addEventListener("click", () => show("start"));
$("next").addEventListener("click", next);
$("quit").addEventListener("click", () => { if (s.results.length === 0 || confirm("처음 화면으로 돌아갈까요? 지금까지 푼 기록은 사라져요.")) show("start"); });
document.addEventListener("keydown", (e) => {
  if ($("quiz").hidden || e.metaKey || e.ctrlKey || e.altKey) return;
  if (!s.answered && /^[1-4]$/.test(e.key)) { answer(+e.key - 1); e.preventDefault(); }
  else if (s.answered && e.key === "Enter" && document.activeElement !== $("next")) { next(); e.preventDefault(); }
});
</script>
</body>
</html>
